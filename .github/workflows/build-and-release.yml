name: Build and Release Prerelease

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            expected-file: sillytavern_linux_x64.tar.gz

          - platform: windows-x64
            runner: windows-latest
            expected-file: sillytavern_win32_x64.zip

          - platform: macos-arm
            runner: macos-latest
            expected-file: sillytavern_darwin_arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build:dist
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-${{ matrix.platform }}
          path: dist/${{ matrix.expected-file }}
          retention-days: 7
          if-no-files-found: error

  build-split:
    name: Build split packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build split distribution
        run: npm run build:split
        env:
          NODE_ENV: production

      - name: Upload split artifact
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-split
          path: |
            dist/node_modules.zip
            dist/webpage.zip
            dist/server.zip
            dist/version.json
          retention-days: 7
          if-no-files-found: error

  create-prerelease:
    name: Create Prerelease
    needs:
      - build
      - build-split
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and commit info
        id: info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          
          TAG="v${VERSION}-dev.${SHORT_SHA}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          find artifacts/ -type f -name "version.json" -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Generate release notes
        id: release-notes
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat > release-notes.md << EOF
          ## 🚀 SillyTavern Development Build

          This is an automated prerelease build from the \`dev\` branch.

          **Version:** ${{ steps.info.outputs.version }}
          **Full Commit:** ${{ github.sha }}
          **Short Hash:** ${{ steps.info.outputs.sha }}
          **Build Date:** $BUILD_DATE

          ### 📦 Available Builds

          - **Linux x64**: \`sillytavern_linux_x64.tar.gz\`
          - **Windows x64**: \`sillytavern_win32_x64.zip\`
          - **macOS Apple Silicon (ARM64)**: \`sillytavern_darwin_arm64.tar.gz\`

          ### 📦 Split Packages

          - **Server package**: \`server.zip\`
          - **Web package**: \`webpage.zip\`
          - **Node modules package**: \`node_modules.zip\`
          - **Version manifest**: \`version.json\`

          ### ⚠️ Warning

          This is a development build and may contain bugs or incomplete features. Use at your own risk.
          EOF
          
          {
            echo "notes<<EOF_RELEASE_NOTES_DELIMITER"
            cat release-notes.md
            echo ""
            echo "EOF_RELEASE_NOTES_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "Development Build (${{ steps.info.outputs.tag }})"
          body: ${{ steps.release-notes.outputs.notes }}
          draft: false
          prerelease: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old prereleases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tag_pattern: dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
