name: Build and Release Prerelease

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: Build for multiple platforms
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            expected-file: sillytavern_linux_x64.tar.gz

          - platform: windows-x64
            runner: windows-latest
            expected-file: sillytavern_win32_x64.zip

          - platform: macos-arm
            runner: macos-latest
            expected-file: sillytavern_darwin_arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build:dist
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-${{ matrix.platform }}
          path: dist/${{ matrix.expected-file }}
          retention-days: 7
          if-no-files-found: error

  # Job 2: Create a single Release with all artifacts
  create-prerelease:
    name: Create Prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and commit info
        id: info
        run: |
          # Read version from package.json
          VERSION=$(node -p "require('./package.json').version")
          # Get short commit hash
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          
          # Format: v1.15.0-dev.4b20429
          TAG="v${VERSION}-dev.${SHORT_SHA}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Find all archives in the downloaded artifacts and move them to a flat folder
          find artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Generate release notes
        id: release-notes
        run: |
          # Create release notes file
          cat > release-notes.md << 'EOF'
          ## 🚀 SillyTavern Development Build

          This is an automated prerelease build from the `dev` branch.

          **Version:** ${{ steps.info.outputs.version }}
          **Full Commit:** ${{ github.sha }}
          **Short Hash:** ${{ steps.info.outputs.sha }}
          **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ### 📦 Available Builds

          - **Linux x64**: `sillytavern_linux_x64.tar.gz`
          - **Windows x64**: `sillytavern_win32_x64.zip`
          - **macOS Apple Silicon (ARM64)**: `sillytavern_darwin_arm64.tar.gz`

          ### ⚠️ Warning

          This is a development build and may contain bugs or incomplete features. Use at your own risk.

          ### 📝 Recent Changes
          EOF

          # Append the last 10 commit messages
          git log --pretty=format:"- %s (%h)" -10 >> release-notes.md
          
          # Securely write multi-line string to GITHUB_OUTPUT
          {
            echo "notes<<EOF_RELEASE_NOTES_DELIMITER"
            cat release-notes.md
            echo "" # Critical: Ensure newline before delimiter
            echo "EOF_RELEASE_NOTES_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "Development Build (${{ steps.info.outputs.tag }})"
          body: ${{ steps.release-notes.outputs.notes }}
          draft: false
          prerelease: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old prereleases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          # Matches tags containing 'dev'
          delete_tag_pattern: dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
